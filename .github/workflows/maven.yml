name: Java CI with Maven

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: reposilite
          server-username: REPOSILITE_USER
          server-password: REPOSILITE_TOKEN

      - name: Build, Test and Package
        run: mvn -B verify

      - name: Publish to Reposilite
#        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/pers'
        run: mvn -B deploy -DskipTests
        env:
          REPOSILITE_USER: github
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joupen-plugin-jars
          path: |
            target/*.jar