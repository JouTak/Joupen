name: Java CI with Maven

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_PR_CLOSED: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
      IS_MERGED_PR_TO_PROD: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && (github.base_ref == 'master' || github.base_ref == 'develop') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: reposilite
          server-username: REPOSILITE_USER
          server-password: REPOSILITE_TOKEN

      - name: Calculate Version
        run: |
          DATE=$(date +'%d%m%y%H')
          if [ "${{ github.base_ref }}" == "master" ]; then
            PREFIX="release"
          else
            PREFIX="develop"
          fi
          echo "VERSION_DATE=Joupen-${PREFIX}-${DATE}" >> $GITHUB_ENV

      - name: Build, Test and Package
        run: mvn -B verify -Drevision=$VERSION_DATE

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joupen-plugin-jars
          path: target/*.jar

      - name: Publish to Reposilite (only after merge to master/develop)
        if: env.IS_MERGED_PR_TO_PROD == 'true'
        env:
          REPOSILITE_USER: joupen
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: mvn -B deploy -DskipTests -Drevision=$VERSION_DATE